services:
  # 1. Linux Container (Ubuntu 24.04 with network & debug tools)
  linux:
    image: linux-ubuntu:latest
    container_name: ws-linux
    restart: unless-stopped
    stdin_open: true
    tty: true
    networks:
      - ws-net

  # 2. Nginx Container (Web & WebSocket Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: ws-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    networks:
      - ws-net

networks:
  ws-net:
    driver: bridge
